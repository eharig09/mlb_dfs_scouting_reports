# Render blueprint for the scouting dashboard.
#
# The app is stateless: it never re-runs the pipeline or calls an API on page load. So a
# deploy is "install seven packages and serve", and the data refreshes by pushing a commit.
#
# What it reads, and therefore what has to be committed:
#
#   MLB   .cache/report_data/          per-game payloads (pickles)
#         dfs_daily_files/             DK salary exports
#   NFL   nfl/snapshot/                precomputed frames (parquet, ~1.3 MB)
#         nfl/nfl_dfs/nfl_daily_files/ DK salary exports
#         nfl/Lineups/                 filled DK entries exports
#
# **The raw PFF drop is deliberately NOT committed.** It is 14 MB of exports, several 500
# columns wide, and the pages read a few dozen of those columns. `python -m nfl.snapshot
# --build` precomputes everything into `nfl/snapshot/` at a twentieth of the size --
# and, more importantly, without the nflverse network calls that the Defence, Teams and
# Trenches pages would otherwise make on every cold start of an ephemeral container.
#
# So the NFL refresh loop is:
#
#   python -m nfl.snapshot --build
#   git add nfl/snapshot nfl/nfl_dfs/nfl_daily_files nfl/Lineups && git commit && git push
#
# Deploy: point Render at this repo and pick "New > Blueprint". It reads this file.

services:
  - type: web
    name: scouting-dashboard
    runtime: python
    plan: free
    # The repo's default branch. Render deploys whatever this names, so it has to match
    # where the work actually lands -- a blueprint pointing at a branch that does not exist
    # deploys nothing and says very little about why.
    branch: main

    # The pipeline's requirements are deliberately not installed here — see
    # requirements-web.txt for why.
    buildCommand: pip install --upgrade pip && pip install -r requirements-web.txt

    # Render injects $PORT and expects the process to bind 0.0.0.0. Streamlit defaults to
    # 8501 on localhost, which Render's health check cannot reach, so both are set
    # explicitly. `--server.headless` stops it trying to open a browser and to prompt for an
    # email on first run, which would otherwise hang the boot.
    startCommand: >-
      streamlit run streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    healthCheckPath: /_stcore/health

    envVars:
      # Developed on 3.14; pinned a minor below because that is what Render installs
      # reliably today. The pickles are version-sensitive to *pandas*, not to the
      # interpreter, and pandas is pinned exactly in requirements-web.txt.
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Streamlit phones home on first run unless told not to; on a fresh container that is
      # a slow no-op at exactly the wrong moment.
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
